# =====================================================================
# LogiTrack · construcción local de las imágenes
#
# Se suma al docker-compose.yml para construir cada imagen desde el repositorio de su servicio:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Los repositorios tienen que estar clonados al lado de este, así:
#   ProyectoFinalDAAS/
#   ├── infra/               <- este repositorio
#   ├── config-server/
#   ├── eureka-server/
#   ├── api-gateway/
#   ├── security-service/
#   ├── courier-service/
#   └── shipment-service/
#
# Cada servicio tiene su Dockerfile en la raíz de su repositorio, y es el contexto de construcción.
# =====================================================================

services:
  config-server:
    build:
      context: ../config-server

  eureka-server:
    build:
      context: ../eureka-server

  security-service:
    build:
      context: ../security-service

  courier-service:
    build:
      context: ../courier-service

  shipment-service:
    build:
      context: ../shipment-service

  api-gateway:
    build:
      context: ../api-gateway
