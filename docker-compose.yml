# =====================================================================
# LogiTrack · entorno completo (infraestructura)
#
# Levanta los 6 servicios, el frontend y las 3 bases MySQL usando las imágenes publicadas en Docker Hub:
#   docker compose up -d
#
# Para construir las imágenes desde el código de cada repositorio, en lugar de descargarlas
# (requiere tener los repos clonados uno al lado del otro, ver README):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Antes de levantarlo hay que copiar .env.example a .env y completar los secretos.
#
# Orden de arranque (S3-09), con depends_on y condition: service_healthy:
#   config-server -> eureka-server -> security, courier y shipment (con sus bases) -> api-gateway
#   -> logitrack-frontend (S4-10)
#
# La app web se abre en http://localhost:3000 (logitrack-frontend); su Nginx le pasa /api al gateway.
# Para la API, desde la PC solo se entra por el api-gateway (8066). También quedan publicados el panel de
# Eureka (8065), el config-server (8888) y las bases (3307-3309, para correr los servicios desde el IDE).
# security, courier y shipment ya no publican 8081-8083: solo se llega a ellos por el gateway.
# Entre contenedores no se usa localhost: cada servicio se encuentra por su nombre
# dentro de la red logitrack-net (config-server, mysql-shipment, courier-service, etc.).
# =====================================================================

name: logitrack

x-servicio-spring: &servicio-spring
  restart: on-failure
  mem_limit: 768m
  networks:
    - logitrack-net

x-mysql: &mysql
  image: mysql:8.4
  restart: unless-stopped
  mem_limit: 512m
  networks:
    - logitrack-net
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 30s

services:

  # ---------------------------------------------------------------- bases de datos
  # Una base por microservicio: ningún servicio lee las tablas de otro.

  mysql-shipment:
    <<: *mysql
    container_name: logitrack-mysql-shipment
    environment:
      MYSQL_DATABASE: logitrack_shipments
      MYSQL_USER: ${DB_USER:-logitrack}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en el archivo .env}
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mysql-shipment-data:/var/lib/mysql
      - ./db/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  mysql-courier:
    <<: *mysql
    container_name: logitrack-mysql-courier
    environment:
      MYSQL_DATABASE: logitrack_couriers
      MYSQL_USER: ${DB_USER:-logitrack}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en el archivo .env}
      TZ: UTC
    ports:
      - "3308:3306"
    volumes:
      - mysql-courier-data:/var/lib/mysql
      - ./db/init/02-couriers.sql:/docker-entrypoint-initdb.d/02-couriers.sql:ro

  mysql-security:
    <<: *mysql
    container_name: logitrack-mysql-security
    environment:
      MYSQL_DATABASE: logitrack_security_db
      MYSQL_USER: ${DB_USER:-logitrack}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en el archivo .env}
      TZ: UTC
    ports:
      - "3309:3306"
    volumes:
      - mysql-security-data:/var/lib/mysql

  # ---------------------------------------------------------------- configuración

  config-server:
    <<: *servicio-spring
    image: ${DOCKERHUB_USER:-logitrack}/logitrack-config-server:${IMAGE_TAG:-3.0.0}
    container_name: logitrack-config-server
    environment:
      CONFIG_REPO_URI: ${CONFIG_REPO_URI:-https://github.com/maxiacostag-cloud/logitrack-config.git}
      CONFIG_REPO_BRANCH: ${CONFIG_REPO_BRANCH:-main}
    ports:
      - "8888:8888"

  # ---------------------------------------------------------------- descubrimiento

  eureka-server:
    <<: *servicio-spring
    image: ${DOCKERHUB_USER:-logitrack}/logitrack-eureka-server:${IMAGE_TAG:-3.0.0}
    container_name: logitrack-eureka-server
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8065:8065"

  # ---------------------------------------------------------------- microservicios
  # Todos arrancan con el perfil prod: toman su configuración del config-server
  # (logitrack-config/<servicio>-prod.yml), se registran en eureka-server y reciben los secretos
  # por variables de entorno.

  security-service:
    <<: *servicio-spring
    image: ${DOCKERHUB_USER:-logitrack}/logitrack-security-service:${IMAGE_TAG:-3.0.0}
    container_name: logitrack-security-service
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql-security:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      DB_USER: ${DB_USER:-logitrack}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}

  courier-service:
    <<: *servicio-spring
    image: ${DOCKERHUB_USER:-logitrack}/logitrack-courier-service:${IMAGE_TAG:-3.0.0}
    container_name: logitrack-courier-service
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql-courier:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      DB_USER: ${DB_USER:-logitrack}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}

  shipment-service:
    <<: *servicio-spring
    image: ${DOCKERHUB_USER:-logitrack}/logitrack-shipment-service:${IMAGE_TAG:-3.0.0}
    container_name: logitrack-shipment-service
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      mysql-shipment:
        condition: service_healthy
      courier-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      DB_USER: ${DB_USER:-logitrack}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}

  # ---------------------------------------------------------------- puerta de entrada

  # Punto único de entrada: valida el JWT, revisa roles y enruta por Eureka (lb://NOMBRE-DEL-SERVICIO).
  api-gateway:
    <<: *servicio-spring
    image: ${DOCKERHUB_USER:-logitrack}/logitrack-api-gateway:${IMAGE_TAG:-3.0.0}
    container_name: logitrack-api-gateway
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      security-service:
        condition: service_healthy
      courier-service:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8066:8066"

  # ---------------------------------------------------------------- frontend (S4-10)

  # Cliente web: Nginx sirve la SPA y le pasa /api al api-gateway por la red interna.
  # El navegador entra por http://localhost:3000 y nunca le habla directo a los servicios.
  logitrack-frontend:
    image: ${DOCKERHUB_USER:-logitrack}/logitrack-frontend:${FRONTEND_TAG:-1.0.0}
    container_name: logitrack-frontend
    restart: on-failure
    mem_limit: 128m
    networks:
      - logitrack-net
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      GATEWAY_URL: http://api-gateway:8066
    ports:
      - "3000:80"

networks:
  logitrack-net:

volumes:
  mysql-shipment-data:
  mysql-courier-data:
  mysql-security-data:
